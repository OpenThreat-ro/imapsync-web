version: "3.8"

services:
  imapsync-web:
    image: razvan1/imapsync-web:latest
    container_name: imapsync-web-app
    restart: unless-stopped
    networks:
      - imapsync-network
    environment:
      - NODE_ENV=production
    # Don't expose port directly since nginx will handle it

  nginx:
    image: nginx:alpine
    container_name: imapsync-web-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment if you have SSL certificates
      # - ./ssl:/etc/nginx/ssl:ro
      # Uncomment for custom nginx logs
      # - ./logs:/var/log/nginx
    depends_on:
      - imapsync-web
    networks:
      - imapsync-network

networks:
  imapsync-network:
    driver: bridge
